<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORKS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: wide-margin catalogue — oversized expanded "WORKS", then a quiet 4-up (PC) / 2-up (phone) jacket grid */
:root {
  --bg: #ffffff;
  --ink: #111111;
  --sub: #707070;
  --line: #e6e6e3;
  --tile: #f3f3f1;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --gutter: clamp(20px, 5.5vw, 80px);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "palt";
}
a { color: inherit; }
.wrap {
  max-width: 1480px;
  margin: 0 auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.site { padding-block: clamp(28px, 5vw, 56px) clamp(56px, 10vw, 128px); }
.topline {
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.topline .name { font-family: var(--body); font-size: clamp(17px, 1.7vw, 22px); font-weight: 700; letter-spacing: .05em; text-transform: none; }
.topline .role { color: var(--sub); }
h1 {
  margin: clamp(40px, 7vw, 88px) 0 0;
  font-family: var(--display);
  font-variation-settings: "wdth" 125;
  font-weight: 300;
  font-size: clamp(44px, 8vw, 112px);
  line-height: .82;
  letter-spacing: -.035em;
  display: flex; align-items: flex-start; gap: .12em;
}
h1 sup {
  font-family: var(--mono); font-weight: 400; font-size: 13px; letter-spacing: .04em;
  line-height: 1; margin-top: .6em; color: var(--sub);
  font-variant-numeric: tabular-nums;
}
.intro {
  margin-top: clamp(32px, 4.5vw, 52px);
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(18px, 3vw, 40px); align-items: start;
}
.intro.no-photo { grid-template-columns: minmax(0, 1fr); }
.portrait {
  width: clamp(104px, 17vw, 220px); max-width: 100%; aspect-ratio: 1 / 1;
  margin: 0; overflow: hidden; background: var(--tile);
}
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-btn {
  all: unset; box-sizing: border-box; position: relative; display: block; width: 100%; height: 100%;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.pf-cap {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 10px;
  background: rgba(17, 17, 17, .58); color: #fff;
  font: 500 11px/1.5 var(--mono); letter-spacing: .06em;
  opacity: 0; transition: opacity .2s ease;
}
@media (hover: hover) { .pf-btn:hover .pf-cap { opacity: 1; } }
.pf-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.pf-btn:focus-visible .pf-cap, .pf-btn.armed .pf-cap { opacity: 1; }
.bio.reveal { animation: bioIn .35s ease-out; }
@keyframes bioIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .bio.reveal { animation: none; } .pf-cap { transition: none; } }
.bio {
  margin: 0;
  max-width: 34em;
  color: #333;
  text-wrap: pretty;
}

/* ---------- filter bar ---------- */
.bar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap;
  border-top: 1px solid var(--ink);
  padding-block: 14px;
  margin-bottom: clamp(28px, 4vw, 48px);
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em;
}
.bar .label { color: var(--sub); text-transform: uppercase; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.bar-r { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
.sel { position: relative; display: inline-flex; align-items: center; gap: 10px; color: var(--sub); text-transform: uppercase; }
.sel select {
  -webkit-appearance: none; appearance: none;
  font: inherit; font-size: 13px; letter-spacing: .04em; text-transform: none; color: var(--ink);
  background: var(--bg); border: 1px solid var(--ink); border-radius: 0;
  padding: 7px 30px 7px 12px; cursor: pointer; min-width: 8.5em;
}
.sel::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: rotate(45deg); pointer-events: none;
}
.sel select:focus-visible, .ms-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ms-btn {
  font: inherit; font-size: 13px; letter-spacing: .04em; text-transform: none; color: var(--ink); text-align: left;
  background: var(--bg); border: 1px solid var(--ink); border-radius: 0;
  padding: 7px 30px 7px 12px; cursor: pointer; min-width: 8.5em; max-width: 16em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ms-pop {
  position: absolute; top: calc(100% + 6px); right: 0; z-index: 20;
  min-width: 100%; width: max-content; max-width: min(280px, calc(100vw - 32px));
  background: var(--bg); border: 1px solid var(--ink); padding: 6px 0;
  box-shadow: 0 8px 24px rgba(0,0,0,.08); text-transform: none;
}
.ms-pop label {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer;
  font-size: 13px; color: var(--ink); letter-spacing: .02em;
}
.ms-pop label:hover { background: var(--tile); }
.ms-pop input { width: 15px; height: 15px; margin: 0; accent-color: var(--ink); }
.ms-pop .ms-all { border-bottom: 1px solid var(--line); margin-bottom: 4px; padding-bottom: 10px; }
@media (max-width: 600px) {
  .bar-r { width: 100%; flex-wrap: nowrap; gap: 10px; }
  .sel { flex: 1 1 0; min-width: 0; flex-direction: column; align-items: stretch; gap: 4px; }
  .sel select, .ms-btn { min-width: 0; max-width: none; width: 100%; padding-left: 10px; }
  #roleWrap .ms-pop { left: 0; right: auto; }
  .sel::after { top: auto; bottom: 16px; margin-top: 0; right: 11px; }
}
.filters button {
  font: inherit; letter-spacing: inherit; color: var(--sub);
  background: none; border: 0; padding: 4px 0; cursor: pointer;
  border-bottom: 1px solid transparent;
}
.filters button:hover { color: var(--ink); }
.filters button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.filters button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

/* ---------- grid ---------- */
.grid {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 44px 16px;
}
@media (min-width: 900px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 80px 32px; }
}
.work { min-width: 0; }
.card {
  all: unset; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 14px;
  width: 100%; min-width: 0; cursor: pointer; text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.card:focus-visible { outline: 2px solid var(--ink); outline-offset: 6px; }
.card:hover img { transform: scale(1.025); }
.card:hover .t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.cover {
  position: relative; display: block;
  aspect-ratio: 1 / 1; width: 100%; max-width: 100%;
  background: var(--tile);
  overflow: hidden;
  text-decoration: none;
}
.cover img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}

/* placeholder when no image */
.ph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 9%;
  border: 1px solid var(--line);
  background: var(--tile);
}
.ph-t {
  font-family: var(--display); font-variation-settings: "wdth" 110;
  font-weight: 400; font-size: clamp(13px, 1.6vw, 20px); line-height: 1.25;
  letter-spacing: -.01em;
  overflow-wrap: anywhere;
}
.ph-t.jp { font-family: var(--body); font-weight: 500; letter-spacing: .02em; }
.ph-b {
  display: flex; justify-content: space-between; gap: 8px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub);
}

/* meta */
.meta { display: grid; gap: 2px; min-width: 0; }
.f {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-bottom: 4px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; color: var(--sub);
  overflow-wrap: anywhere;
}
.t {
  display: block; font-size: 15px; font-weight: 700; line-height: 1.45;
  overflow-wrap: anywhere;
}
.a { display: block; font-size: 13px; color: #333; overflow-wrap: anywhere; }
.c {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  font-size: 12px; color: var(--sub);
}
.c .cr { min-width: 0; overflow-wrap: anywhere; }
.c .y { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
/* ---------- detail view ---------- */
html.lock { overflow: hidden; }
dialog.detail {
  border: 0; padding: 0; margin: 0;
  width: 100%; height: 100%; max-width: none; max-height: none;
  background: var(--bg); color: var(--ink);
  overflow: auto; overscroll-behavior: contain;
}
dialog.detail::backdrop { background: var(--bg); }
dialog.detail[open] { animation: dIn .28s ease-out; }
@keyframes dIn { from { opacity: 0; } to { opacity: 1; } }
.d-frame {
  min-height: 100%;
  display: flex; flex-direction: column;
  max-width: 1480px; margin: 0 auto;
  padding-top: max(20px, env(safe-area-inset-top, 0px));
  padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
.d-top, .d-nav {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.d-top { padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.d-idx { color: var(--sub); font-variant-numeric: tabular-nums; }
.d-top button, .d-nav button {
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink);
  background: none; border: 0; padding: 8px 0; cursor: pointer;
}
.d-close span { font-size: 18px; line-height: 0; vertical-align: -2px; margin-left: 4px; }
.d-nav { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); }
.d-nav button:disabled { color: var(--line); cursor: default; }
.d-top button:focus-visible, .d-nav button:focus-visible, .d-btn:focus-visible, .d-url button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.d-body {
  flex: 1;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px;
  padding-block: 28px 48px;
}
@media (min-width: 900px) {
  .d-body { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(40px, 6vw, 96px); align-items: start; padding-block: 48px; }
  .d-body .d-art { position: sticky; top: 32px; }
  .d-info { padding-top: 8px; }
}
.d-art {
  position: relative; aspect-ratio: 1 / 1; width: 100%; max-width: min(100%, 680px);
  background: var(--tile); overflow: hidden;
}
.d-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.d-art .ph-t { font-size: clamp(20px, 3vw, 36px); }
.d-art .ph-b { font-size: 11px; }
.d-info { min-width: 0; max-width: 34em; }
.md {
  display: inline-block; border: 1px solid var(--line); color: var(--sub);
  font-family: var(--mono); font-size: 10px; letter-spacing: .04em; line-height: 1; padding: 3px 5px;
}
.fm { margin-right: 2px; }
.d-format {
  margin: 0 0 12px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--sub);
  overflow-wrap: anywhere;
}
.d-title {
  margin: 0; font-family: var(--body); font-weight: 700;
  font-size: clamp(26px, 3.6vw, 44px); line-height: 1.25; letter-spacing: .01em;
  overflow-wrap: anywhere; text-wrap: balance;
}
.d-artist { margin: 10px 0 0; font-size: clamp(15px, 1.4vw, 18px); color: #333; }
.d-spec { margin: 32px 0 0; border-top: 1px solid var(--ink); }
.d-spec div {
  display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 12px;
  padding-block: 12px; border-bottom: 1px solid var(--line);
}
.d-spec dt { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); padding-top: 2px; }
.d-spec dd { margin: 0; overflow-wrap: anywhere; }
#dDate { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.d-note { margin: 24px 0 0; color: #333; white-space: pre-line; text-wrap: pretty; }
.d-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
.d-btn {
  display: inline-flex; align-items: center; gap: 10px;
  font: 500 14px var(--body); letter-spacing: .02em;
  padding: 13px 22px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink);
  text-decoration: none; cursor: pointer;
}
.d-btn:hover { background: var(--ink); color: var(--bg); }
.d-link { background: var(--ink); color: var(--bg); }
.d-link:hover { background: #333; }
.d-play svg { width: 11px; height: 11px; fill: currentColor; }
.d-play .i-pause { display: none; }
.d-play.on { background: var(--ink); color: var(--bg); }
.d-play.on .i-play { display: none; }
.d-play.on .i-pause { display: inline; }
.d-tracks { margin-top: 36px; }
.d-tracks-h { margin: 0 0 4px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); }
.d-tracks-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.trk { padding-block: 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.trk-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.trk-t { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; min-width: 0; }
.trk-c { font-size: 12px; color: var(--sub); }
.trk-ar { margin: -4px 0 0; font-size: 13px; color: #333; overflow-wrap: anywhere; }
.trk-n { margin: 0; font-size: 14px; color: #333; white-space: pre-line; }
.trk-a { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.trk-a a, .trk-a button {
  font: 500 13px var(--body); color: var(--ink); background: none; border: 0; padding: 4px 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
  display: inline-flex; align-items: center; gap: 6px;
}
.trk-a button { text-decoration: none; border: 1px solid var(--ink); padding: 5px 12px; }
.trk-a button.on { background: var(--ink); color: var(--bg); }
.trk-a svg { width: 9px; height: 9px; fill: currentColor; }
.trk-a .i-pause, .d-play .i-pause { display: none; }
.trk-a button.on .i-play { display: none; }
.trk-a button.on .i-pause { display: inline; }
.trk-a a:focus-visible, .trk-a button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.d-url {
  margin-top: 18px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
  font-family: var(--mono); font-size: 12px;
}
.d-url .k { color: var(--sub); letter-spacing: .06em; }
.d-url .v { overflow-wrap: anywhere; user-select: all; color: #333; }
.d-url button {
  font: inherit; text-transform: uppercase; letter-spacing: .06em; color: var(--ink);
  background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 0; cursor: pointer;
}

.empty { padding-block: 80px; color: var(--sub); text-align: center; grid-column: 1 / -1; }

/* ---------- footer ---------- */
footer { padding-block: clamp(96px, 14vw, 180px) 40px; }
.contact {
  border-top: 1px solid var(--ink); padding-top: 18px;
  display: grid; gap: 28px;
}
@media (min-width: 900px) { .contact { grid-template-columns: 1fr 1fr; } }
.contact .k { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); margin: 0 0 6px; }
.inq { margin: 18px 0 0; max-width: 30em; color: #333; }
.sns { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sns a {
  font-family: var(--display); font-variation-settings: "wdth" 115; font-weight: 300;
  font-size: clamp(22px, 3.4vw, 40px); letter-spacing: -.01em; line-height: 1.25;
  text-decoration: none; display: inline-flex; gap: .3em; align-items: baseline;
}
.sns a span { font-size: .5em; color: var(--sub); }
.sns a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.sns a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.mail {
  font-family: var(--display); font-variation-settings: "wdth" 115; font-weight: 300;
  font-size: clamp(22px, 3.4vw, 40px); letter-spacing: -.01em; line-height: 1.2;
  overflow-wrap: anywhere; user-select: all; margin: 0;
}
.copy {
  font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase;
  background: none; border: 1px solid var(--ink); padding: 8px 14px; margin-top: 14px; cursor: pointer; color: var(--ink);
}
.copy:hover { background: var(--ink); color: var(--bg); }
.fine { margin-top: 64px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .04em; }

@media (prefers-reduced-motion: reduce) {
  .cover img { transition: none; }
  .card:hover img { transform: none; }
  dialog.detail[open] { animation: none; }
}
</style>
</head>
<body>

<header class="site wrap">
  <div class="topline">
    <span class="name" id="siteName"></span>
    <span class="role" id="siteRole"></span>
  </div>
  <h1>WORKS<sup id="count"></sup></h1>
  <div class="intro" id="intro">
    <figure class="portrait" id="portrait">
      <button type="button" class="pf-btn" id="pfBtn" aria-expanded="false" aria-controls="siteBio">
        <img id="photo" alt="">
        <span class="pf-cap" id="pfCap" aria-hidden="true">プロフィールを表示</span>
      </button>
    </figure>
    <p class="bio" id="siteBio"></p>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <span class="label">Selected Works</span>
    <div class="bar-r">
      <div class="sel ms" id="roleWrap"><span id="roleLbl">Credit</span>
        <button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false" aria-labelledby="roleLbl roleVal"><span class="ms-val" id="roleVal">All</span></button>
        <div class="ms-pop" role="group" aria-labelledby="roleLbl" hidden></div>
      </div>
      <div class="sel ms" id="mediaWrap"><span id="mediaLbl">Media</span>
        <button type="button" class="ms-btn" aria-haspopup="true" aria-expanded="false" aria-labelledby="mediaLbl mediaVal"><span class="ms-val" id="mediaVal">All</span></button>
        <div class="ms-pop" role="group" aria-labelledby="mediaLbl" hidden></div>
      </div>
      <label class="sel"><span>Sort</span>
        <select id="sortSel" aria-label="並び順">
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
        </select>
      </label>
    </div>
  </div>
  <ul class="grid" id="grid"></ul>
</main>

<footer class="wrap">
  <div class="contact">
    <div>
      <p class="k">Contact</p>
      <div id="mailBox">
        <p class="mail" id="mail"></p>
        <button class="copy" id="copyMail" type="button">Copy address</button>
      </div>
      <p class="inq" id="inquiry"></p>
    </div>
    <div id="linksBox">
      <p class="k">Links</p>
      <ul class="sns" id="links"></ul>
    </div>
  </div>
  <div class="fine"><span id="copyright"></span><span>Works list</span></div>
</footer>

<dialog class="detail" id="detail" aria-labelledby="dTitle">
  <div class="d-frame">
    <div class="d-top">
      <span class="d-idx" id="dIdx"></span>
      <button class="d-close" id="dClose" type="button">Close <span aria-hidden="true">×</span></button>
    </div>
    <div class="d-body">
      <div class="d-art" id="dArt"></div>
      <div class="d-info">
        <p class="d-format" id="dFormat"></p>
        <h2 class="d-title" id="dTitle"></h2>
        <p class="d-artist" id="dArtist"></p>
        <dl class="d-spec">
          <div><dt>Credit</dt><dd id="dCredit"></dd></div>
          <div><dt>Date</dt><dd id="dDate"></dd></div>
          <div id="dMediaRow"><dt>Media</dt><dd id="dMedia"></dd></div>
        </dl>
        <p class="d-note" id="dNote"></p>
        <div class="d-tracks" id="dTracksBox" hidden>
          <p class="d-tracks-h" id="dTracksH"></p>
          <ol class="d-tracks-list" id="dTracks"></ol>
        </div>
        <div class="d-actions" id="dActions">
          <button class="d-btn d-play" id="dPlay" type="button">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path class="i-play" d="M2 1l9 5-9 5z"/><path class="i-pause" d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span class="lbl">試聴する</span>
          </button>
          <a class="d-btn d-link" id="dLink" href="#" target="_blank" rel="noopener"><span class="lbl"></span> <span aria-hidden="true">↗</span></a>
        </div>
        <div class="d-url" id="dUrlBox">
          <span class="k">URL</span>
          <span class="v" id="dUrl"></span>
          <button type="button" id="dCopy">Copy</button>
        </div>
      </div>
    </div>
    <div class="d-nav">
      <button type="button" id="dPrev">← Prev</button>
      <button type="button" id="dNext">Next →</button>
    </div>
  </div>
</dialog>

<script src="works.js"></script>
<script>
(function () {
  var SITE = window.SITE || {};
  var WORKS = Array.isArray(window.WORKS) ? window.WORKS : [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function roles(credit) {
    return String(credit || "").split(/[・、,，\/／]+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }
  function hasJP(s) { return /[぀-ヿ㐀-鿿]/.test(s || ""); }
  function dateOf(w) { return String(w.date || w.year || ""); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  // site info
  document.getElementById("siteName").textContent = SITE.name || "";
  document.getElementById("siteRole").textContent = SITE.role || "";
  document.getElementById("siteBio").textContent = SITE.bio || "";
  (function () {
    var photo = String(SITE.photo === undefined ? "profile.jpg" : (SITE.photo || "")).trim(), fig = document.getElementById("portrait"), img = document.getElementById("photo");
    var bio = document.getElementById("siteBio"), btn = document.getElementById("pfBtn"), cap = document.getElementById("pfCap");
    function off() { fig.hidden = true; document.getElementById("intro").classList.add("no-photo"); bio.hidden = false; }
    if (!photo) { off(); return; }
    img.alt = (SITE.name || "") + " のプロフィール写真";
    img.onerror = off;
    img.src = photo;
    if (!bio.textContent) { btn.disabled = true; cap.hidden = true; return; }
    // the introduction opens from the photo: hover (or first tap on a touch screen) shows the label, click/second tap opens
    bio.hidden = true;
    btn.setAttribute("aria-label", "プロフィールを表示");
    var pointer = "mouse", armed = false;
    function setOpen(open) {
      bio.hidden = !open;
      btn.setAttribute("aria-expanded", String(open));
      cap.textContent = open ? "プロフィールを閉じる" : "プロフィールを表示";
      btn.setAttribute("aria-label", cap.textContent);
      if (open) { bio.classList.remove("reveal"); void bio.offsetWidth; bio.classList.add("reveal"); }
      armed = false; btn.classList.remove("armed");
    }
    btn.addEventListener("pointerdown", function (e) { pointer = e.pointerType || "mouse"; });
    btn.addEventListener("click", function () {
      var open = btn.getAttribute("aria-expanded") === "true";
      if (pointer !== "mouse" && !open && !armed) { armed = true; btn.classList.add("armed"); pointer = "mouse"; return; }
      pointer = "mouse";
      setOpen(!open);
    });
    document.addEventListener("pointerdown", function (e) {
      if (armed && !btn.contains(e.target)) { armed = false; btn.classList.remove("armed"); }
    });
  })();
  // contact: email (if it is really an address) + SNS links
  function snsLabel(url) {
    var h = ""; try { h = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
    if (/^(x|twitter)\.com$/.test(h)) return "X";
    if (/instagram\.com$/.test(h)) return "Instagram";
    if (/(youtube\.com|youtu\.be)$/.test(h)) return "YouTube";
    if (/soundcloud\.com$/.test(h)) return "SoundCloud";
    if (/tiktok\.com$/.test(h)) return "TikTok";
    if (/threads\.(net|com)$/.test(h)) return "Threads";
    if (/bsky\.app$/.test(h)) return "Bluesky";
    if (/note\.com$/.test(h)) return "note";
    return "Website";
  }
  var email = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(SITE.email || "").trim()) ? SITE.email.trim() : "";
  var links = (Array.isArray(SITE.links) ? SITE.links : []).filter(Boolean);
  if (!email && /^https?:\/\//.test(String(SITE.email || "").trim())) links.unshift(SITE.email.trim()); // older data: URL typed in the email field
  document.getElementById("mail").textContent = email;
  document.getElementById("mailBox").hidden = !email;
  document.getElementById("inquiry").textContent = email
    ? "楽曲制作・編曲・CM / 映像音楽のご依頼は、上記アドレスまでお気軽にご連絡ください。"
    : "楽曲制作・編曲・CM / 映像音楽のご依頼は、各SNSのメッセージからお気軽にご連絡ください。";
  document.getElementById("links").innerHTML = links.map(function (u) {
    var label = snsLabel(u); if (!label) return "";
    return '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(label) + ' <span aria-hidden="true">↗</span></a></li>';
  }).join("");
  document.getElementById("linksBox").hidden = !links.length;
  document.getElementById("copyright").textContent = "© " + new Date().getFullYear() + " " + (SITE.name || "");
  if (SITE.name) document.title = "WORKS — " + SITE.name;
  if (!email && !links.length) document.querySelector(".contact").hidden = true;

  document.getElementById("copyMail").addEventListener("click", function (e) {
    var btn = e.currentTarget, mail = SITE.email || "";
    function done(ok) { btn.textContent = ok ? "Copied" : "Select & copy"; setTimeout(function () { btn.textContent = "Copy address"; }, 1800); }
    try {
      navigator.clipboard.writeText(mail).then(function () { done(true); }, function () { selectMail(); done(false); });
    } catch (err) { selectMail(); done(false); }
  });
  function selectMail() {
    var r = document.createRange(); r.selectNodeContents(document.getElementById("mail"));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  // filters
  var all = [];
  WORKS.forEach(function (w) { roles(w.credit).forEach(function (r) { if (all.indexOf(r) < 0) all.push(r); }); });
  var order = ["作曲", "作詞", "編曲"];
  all.sort(function (a, b) {
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  // ---------- multi-select dropdowns (Credit / Media) ----------
  function multiSelect(wrapId, onChange) {
    var wrap = document.getElementById(wrapId), btn = wrap.querySelector(".ms-btn"),
        pop = wrap.querySelector(".ms-pop"), val = wrap.querySelector(".ms-val");
    var picked = [], items = [];
    function label() { val.textContent = picked.length ? picked.join(", ") : "All"; }
    function draw() {
      pop.innerHTML = '<label class="ms-all"><input type="checkbox" data-all' + (picked.length ? "" : " checked") + "> All</label>" +
        items.map(function (it) {
          return '<label><input type="checkbox" value="' + esc(it) + '"' + (picked.indexOf(it) >= 0 ? " checked" : "") + "> " + esc(it) + "</label>";
        }).join("");
    }
    function open(on) {
      pop.hidden = !on; btn.setAttribute("aria-expanded", String(on));
      if (on) { draw(); var f = pop.querySelector("input"); if (f) f.focus(); }
    }
    btn.addEventListener("click", function () { open(pop.hidden); });
    pop.addEventListener("change", function (e) {
      var cb = e.target;
      if (cb.hasAttribute("data-all")) picked = [];
      else if (cb.checked) { if (picked.indexOf(cb.value) < 0) picked.push(cb.value); }
      else picked = picked.filter(function (x) { return x !== cb.value; });
      picked.sort(function (a, b) { return items.indexOf(a) - items.indexOf(b); });
      draw(); label(); onChange(picked);
      var again = pop.querySelector(cb.hasAttribute("data-all") ? "[data-all]" : 'input[value="' + cb.value.replace(/"/g, '\\"') + '"]'); if (again) again.focus();
    });
    document.addEventListener("click", function (e) { if (!pop.hidden && !wrap.contains(e.target)) open(false); });
    wrap.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pop.hidden) { open(false); btn.focus(); } });
    return {
      set: function (list) { items = list; picked = picked.filter(function (x) { return list.indexOf(x) >= 0; }); label(); wrap.hidden = list.length < 2; }
    };
  }

  var roleSet = [], mediaSet = [];
  var roleMS = multiSelect("roleWrap", function (p) { roleSet = p; drawGrid(); });
  var mediaMS = multiSelect("mediaWrap", function (p) { mediaSet = p; drawGrid(); });
  function drawFilters() { roleMS.set(all); }

  // media names: older data may say デジタル配信
  var MEDIA_ORDER = ["CD", "Digital", "Blu-ray", "DVD", "アナログ盤"];
  function normMedia(m) { m = String(m || "").trim(); return /^(デジタル配信|デジタル|digital)$/i.test(m) ? "Digital" : m; }
  function drawMedia() {
    var mAll = [];
    WORKS.forEach(function (w) {
      String(w.media || "").split(/[・、,，\/／]+/).forEach(function (m) { m = normMedia(m); if (m && mAll.indexOf(m) < 0) mAll.push(m); });
    });
    mAll.sort(function (a, b) { var ia = MEDIA_ORDER.indexOf(a), ib = MEDIA_ORDER.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    mediaMS.set(mAll);
  }
  document.getElementById("sortSel").addEventListener("change", function () { sortDir = this.value; drawGrid(); });

  function placeholder(w) {
    var t = w.title || "Untitled";
    return '<span class="ph"><span class="ph-t' + (hasJP(t) ? " jp" : "") + '">' + esc(t) + '</span>' +
      '<span class="ph-b"><span>No image</span><span>' + esc(dateOf(w)) + "</span></span></span>";
  }
  function coverHTML(w, lazy) {
    return w.image
      ? '<img src="' + esc(w.image) + '" alt="' + esc((w.title || "") + " ジャケット") + '"' + (lazy ? ' loading="lazy"' : "") + ">"
      : placeholder(w);
  }
  function guardImages(root, w) {
    root.querySelectorAll("img").forEach(function (im) {
      im.addEventListener("error", function () { im.insertAdjacentHTML("afterend", placeholder(w(im))); im.remove(); });
    });
  }

  // ---------- group songs on the same album ----------
  function unionRoles(tracks) {
    var out = [];
    tracks.forEach(function (t) { roles(t.credit).forEach(function (r) { if (out.indexOf(r) < 0) out.push(r); }); });
    out.sort(function (a, b) { var ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
    return out.join("・");
  }
  // Apple Music song links on one album differ only by the song (?i=…): treat them as the album page
  function appleAlbum(url) {
    try {
      var u = new URL(url);
      if (!/(music|itunes)\.apple\.com$/.test(u.hostname)) return null;
      var parts = u.pathname.split("/").filter(Boolean), id = "";
      for (var i = parts.length - 1; i >= 0; i--) { var m = parts[i].match(/^(?:id)?(\d{5,})$/); if (m) { id = m[1]; break; } }
      if (!id || parts.indexOf("album") < 0) return null;
      return { cc: /^[a-z]{2}$/i.test(parts[0]) ? parts[0] : "jp", id: id };
    } catch (e) { return null; }
  }
  function linkKey(url) {
    url = String(url || "").trim(); if (!url) return "";
    var a = appleAlbum(url); if (a) return "apple:" + a.id;
    try {
      var u = new URL(url, location.href);
      var keep = /(youtube\.com)$/.test(u.hostname) ? (u.searchParams.get("v") || "") : u.search; // YouTube: the video id matters
      return (u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/+$/, "") + keep).toLowerCase();
    } catch (e) { return url; }
  }
  function albumUrl(url) {
    var a = appleAlbum(url); return a ? "https://music.apple.com/" + a.cc + "/album/" + a.id : url;
  }
  function splitArtists(s) { return String(s || "").split(/\s*[,，、]\s*/).map(function (x) { return x.trim(); }).filter(Boolean); }
  function mediaList(v) { return String(v || "").split(/[・、,，\/／]+/).map(normMedia).filter(Boolean); }
  function mediaTags(list) { return list.map(function (m) { return '<span class="md">' + esc(m) + "</span>"; }).join(""); }
  function asSingle(w, album) {
    return { album: false, tracks: [w], title: w.title, artist: w.artist, media: mediaList(w.media),
      format: w.format || (album ? album + " 収録" : ""), date: dateOf(w), image: w.image,
      link: w.link, credit: w.credit, note: w.note, audio: w.audio };
  }
  var ITEMS = [], groups = {};
  WORKS.forEach(function (w) {
    var a = String(w.album || "").trim();
    if (!a) { ITEMS.push(asSingle(w)); return; }
    var key = a;
    var g = groups[key];
    if (!g) { g = groups[key] = { album: true, name: a, tracks: [], title: a, artist: w.artist, format: "", date: "", image: "", link: "" }; ITEMS.push(g); }
    g.tracks.push(w);
    if (!g.format && w.format) g.format = w.format;
    if (!g.image && w.image) g.image = w.image;
    if (!g.date && dateOf(w)) g.date = dateOf(w);
  });
  ITEMS = ITEMS.map(function (g) {
    if (g.album && g.tracks.length === 1) return asSingle(g.tracks[0], g.name);
    if (g.album) {
      g.credit = unionRoles(g.tracks);
      g.media = [];
      g.tracks.forEach(function (t) { mediaList(t.media).forEach(function (m) { if (g.media.indexOf(m) < 0) g.media.push(m); }); });
      // compilation albums: show the artists every track shares, and each track's own artists in the list
      var lists = g.tracks.map(function (t) { return splitArtists(t.artist); });
      var same = g.tracks.every(function (t) { return String(t.artist || "") === String(g.tracks[0].artist || ""); });
      var common = lists[0].filter(function (x) { return lists.every(function (l) { return l.indexOf(x) >= 0; }); });
      g.artist = same ? g.tracks[0].artist : (common.length ? common.join(", ") : "Various Artists");
      g.mixed = !same; g.common = common;
      // one link shared by the songs (e.g. the album page): show it once for the whole album
      // a page used by several songs of this album is shown once for the album, not under every song
      var count = {}, firstUrl = {};
      g.tracks.forEach(function (t) {
        var k = linkKey(t.link); if (!k) return;
        count[k] = (count[k] || 0) + 1; if (!firstUrl[k]) firstUrl[k] = t.link;
      });
      var keys = Object.keys(count);
      g.sharedKeys = keys.filter(function (k) { return count[k] >= 2 || keys.length === 1; });
      g.sharedLinks = g.sharedKeys.map(function (k) { return albumUrl(firstUrl[k]); });
      g.link = g.sharedLinks[0] || "";
    }
    return g;
  });

  // newest release first; songs without a date go last; same date keeps the editor's order
  function dateKey(d) {
    var m = String(d || "").match(/(\d{4})(?:\D+(\d{1,2}))?(?:\D+(\d{1,2}))?/);
    if (!m) return -1;
    return +m[1] * 10000 + (m[2] ? +m[2] : 0) * 100 + (m[3] ? +m[3] : 0);
  }
  ITEMS.forEach(function (g, i) { g._i = i; g._k = dateKey(g.date); });
  var sortDir = "new";
  function sortItems(arr) {
    return arr.slice().sort(function (a, b) {
      if ((a._k < 0) !== (b._k < 0)) return a._k < 0 ? 1 : -1; // undated always last
      return (sortDir === "new" ? b._k - a._k : a._k - b._k) || a._i - b._i;
    });
  }

  // ---------- grid ----------
  var list = [];
  var grid = document.getElementById("grid");
  function drawGrid() {
    list = sortItems(ITEMS).filter(function (g) {
      return (!roleSet.length || g.tracks.some(function (t) { return roles(t.credit).some(function (r) { return roleSet.indexOf(r) >= 0; }); })) &&
        (!mediaSet.length || g.media.some(function (m) { return mediaSet.indexOf(m) >= 0; }));
    });
    document.getElementById("count").textContent = "(" + pad(WORKS.length) + ")";
    if (!list.length) { grid.innerHTML = '<li class="empty">' + (WORKS.length ? "条件に合う作品がありません。" : "作品がまだ登録されていません。") + "</li>"; return; }
    grid.innerHTML = list.map(function (w, i) {
      return '<li class="work"><button class="card" type="button" data-i="' + i + '" aria-haspopup="dialog">' +
        '<span class="cover">' + coverHTML(w, true) + "</span>" +
        '<span class="meta">' + ((w.format || w.media.length) ? '<span class="f">' + (w.format ? '<span class="fm">' + esc(w.format) + "</span>" : "") + mediaTags(w.media) + "</span>" : "") + '<span class="t">' + esc(w.title || "Untitled") + "</span>" +
        (w.artist ? '<span class="a">' + esc(w.artist) + "</span>" : "") +
        '<span class="c"><span class="cr">' + esc(w.credit || "") + (w.album ? " ／ " + w.tracks.length + "曲" : "") + '</span><span class="y">' + esc(dateOf(w) || "—") + "</span></span>" +
        "</span></button></li>";
    }).join("");
    guardImages(grid, function (im) { return list[+im.closest(".card").getAttribute("data-i")]; });
  }
  grid.addEventListener("click", function (e) {
    var c = e.target.closest(".card"); if (c) openDetail(+c.getAttribute("data-i"));
  });

  // ---------- detail ----------
  var dlg = document.getElementById("detail");
  var pos = 0, lastCard = null;
  var player = new Audio(), curBtn = null;
  var playBtn = document.getElementById("dPlay");
  function mark(btn, on) {
    if (!btn) return;
    btn.classList.toggle("on", on);
    var l = btn.querySelector(".lbl"); if (l) l.textContent = on ? "停止" : "試聴する";
  }
  function stopAudio() { player.pause(); mark(curBtn, false); curBtn = null; }
  player.addEventListener("ended", stopAudio);
  function toggleAudio(btn) {
    if (curBtn === btn) { stopAudio(); return; }
    stopAudio();
    player.src = btn.getAttribute("data-src"); curBtn = btn; mark(btn, true);
    var p = player.play(); if (p && p.catch) p.catch(stopAudio);
  }
  dlg.addEventListener("click", function (e) { var b = e.target.closest("[data-src]"); if (b) toggleAudio(b); });
  var ICON = '<svg viewBox="0 0 12 12" aria-hidden="true"><path class="i-play" d="M2 1l9 5-9 5z"/><path class="i-pause" d="M2 1h3v10H2zM7 1h3v10H7z"/></svg>';

  function serviceName(url) {
    var h = ""; try { h = new URL(url, location.href).hostname; } catch (e) {}
    if (/apple\.com$/.test(h)) return "Apple Music で聴く";
    if (/spotify\.com$/.test(h)) return "Spotify で聴く";
    if (/(youtube\.com|youtu\.be)$/.test(h)) return "YouTube で見る";
    if (/soundcloud\.com$/.test(h)) return "SoundCloud で聴く";
    return "作品ページを開く";
  }

  function fillDetail() {
    var w = list[pos]; if (!w) return;
    stopAudio();
    document.getElementById("dIdx").textContent = pad(pos + 1) + " / " + pad(list.length);
    var art = document.getElementById("dArt");
    art.innerHTML = coverHTML(w, false);
    guardImages(art, function () { return w; });
    var fm = document.getElementById("dFormat"); fm.textContent = w.format || ""; fm.hidden = !w.format;
    document.getElementById("dTitle").textContent = w.title || "Untitled";
    var ar = document.getElementById("dArtist"); ar.textContent = w.artist || ""; ar.hidden = !w.artist;
    document.getElementById("dCredit").textContent = w.credit || "—";
    document.getElementById("dDate").textContent = dateOf(w) || "—";
    document.getElementById("dMedia").textContent = w.media.join(" / ");
    document.getElementById("dMediaRow").hidden = !w.media.length;
    var note = document.getElementById("dNote"); note.textContent = w.note || ""; note.hidden = !w.note;
    playBtn.hidden = !w.audio; if (w.audio) playBtn.setAttribute("data-src", w.audio); else playBtn.removeAttribute("data-src");
    var link = document.getElementById("dLink"), urlBox = document.getElementById("dUrlBox");
    link.hidden = urlBox.hidden = !w.link;
    var tbox = document.getElementById("dTracksBox");
    tbox.hidden = !w.album;
    if (w.album) {
      document.getElementById("dTracksH").textContent = "Works on this album — " + w.tracks.length + "曲";
      document.getElementById("dTracks").innerHTML = w.tracks.map(function (t) {
        var own = w.mixed ? splitArtists(t.artist).filter(function (x) { return w.common.indexOf(x) < 0; }).join(", ") : "";
        return '<li class="trk"><div class="trk-h"><span class="trk-t">' + esc(t.title || "Untitled") + '</span><span class="trk-c">' + esc(t.credit || "") + "</span></div>" +
          (own ? '<p class="trk-ar">' + esc(own) + "</p>" : "") +
          (t.note ? '<p class="trk-n">' + esc(t.note) + "</p>" : "") +
          ((t.audio || (t.link && w.sharedKeys.indexOf(linkKey(t.link)) < 0)) ? '<div class="trk-a">' +
            (t.audio ? '<button type="button" data-src="' + esc(t.audio) + '">' + ICON + '<span class="lbl">試聴する</span></button>' : "") +
            (t.link && w.sharedKeys.indexOf(linkKey(t.link)) < 0 ? '<a href="' + esc(t.link) + '" target="_blank" rel="noopener">' + esc(serviceName(t.link)) + ' <span aria-hidden="true">↗</span></a>' : "") +
            "</div>" : "") + "</li>";
      }).join("");
    }
    if (w.link) {
      link.href = w.link;
      link.querySelector(".lbl").textContent = serviceName(w.link);
      document.getElementById("dUrl").textContent = w.link;
    }
    var acts = document.getElementById("dActions");
    acts.querySelectorAll(".d-more").forEach(function (x) { x.remove(); });
    if (w.album && w.sharedLinks.length > 1) {
      w.sharedLinks.slice(1).forEach(function (u) {
        var a = document.createElement("a");
        a.className = "d-btn d-more"; a.href = u; a.target = "_blank"; a.rel = "noopener";
        a.innerHTML = esc(serviceName(u)) + ' <span aria-hidden="true">↗</span>';
        acts.appendChild(a);
      });
      urlBox.hidden = true;
    }
    document.getElementById("dActions").hidden = !w.audio && !w.link;
    document.getElementById("dPrev").disabled = pos === 0;
    document.getElementById("dNext").disabled = pos === list.length - 1;
    dlg.querySelector(".d-body").scrollTop = 0; dlg.scrollTop = 0;
  }
  function openDetail(i) {
    pos = i; lastCard = document.activeElement; fillDetail();
    if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", ""); }
    document.documentElement.classList.add("lock");
    document.getElementById("dClose").focus();
  }
  function closeDetail() {
    stopAudio();
    if (dlg.open) { if (dlg.close) dlg.close(); else dlg.removeAttribute("open"); }
  }
  dlg.addEventListener("close", function () {
    stopAudio(); document.documentElement.classList.remove("lock");
    if (lastCard && lastCard.focus) lastCard.focus();
  });
  document.getElementById("dClose").addEventListener("click", closeDetail);
  document.getElementById("dPrev").addEventListener("click", function () { if (pos > 0) { pos--; fillDetail(); } });
  document.getElementById("dNext").addEventListener("click", function () { if (pos < list.length - 1) { pos++; fillDetail(); } });
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && pos > 0) { pos--; fillDetail(); }
    if (e.key === "ArrowRight" && pos < list.length - 1) { pos++; fillDetail(); }
  });
  // swipe left/right on phones
  var sx = null;
  dlg.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  dlg.addEventListener("touchend", function (e) {
    if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) < 60) return;
    if (dx < 0 && pos < list.length - 1) { pos++; fillDetail(); }
    if (dx > 0 && pos > 0) { pos--; fillDetail(); }
  }, { passive: true });

  document.getElementById("dCopy").addEventListener("click", function (e) {
    var btn = e.currentTarget, url = document.getElementById("dUrl").textContent;
    function done(t) { btn.textContent = t; setTimeout(function () { btn.textContent = "Copy"; }, 1600); }
    function sel() { var r = document.createRange(); r.selectNodeContents(document.getElementById("dUrl")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    try { navigator.clipboard.writeText(url).then(function () { done("Copied"); }, function () { sel(); done("Select"); }); }
    catch (err) { sel(); done("Select"); }
  });

  drawFilters(); drawMedia(); drawGrid();
})();
</script>
</body>
</html>
